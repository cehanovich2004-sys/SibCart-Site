<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>СИБКАРТ — 3D модель</title>
  <style>
    :root{
      --main:#8B5CF6;
      --accent-warm:#d84035;
      --bg:#050607;
      --text:rgba(246,248,250,.96);
      --muted:rgba(246,248,250,.66);
      --line:rgba(255,255,255,.14);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* top bar */
    .topbar{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(5,6,7,0.86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .brand-group{
      display:flex;
      align-items:center;
      gap: 16px;
      min-width: 0;
    }

    .brand{
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 14px;
      color: var(--text);
      user-select:none;
      white-space:nowrap;
    }

    .topbar-partners{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-partners img{
      width: auto;
      height: clamp(34px, 3.2vw, 48px);
      object-fit: contain;
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
    }

    .topbar-partners .topbar-logo-platform{
      height: clamp(42px, 3.8vw, 58px);
    }

    .actions{
      display:flex;
      gap: 10px;
      align-items:center;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      background: linear-gradient(135deg, var(--main), var(--accent-warm));
      box-shadow: none;
      line-height: 1;
      white-space:nowrap;
    }

    .btn:disabled{
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    .btn.secondary{
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    /* canvas wrapper */
    #wrap{
      position: absolute;
      inset: 78px 0 0;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(139,92,246,0.18), transparent 34%),
        linear-gradient(180deg, #08090d 0%, #050607 100%);
    }

    canvas{display:block}

    .status{
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 12;
      width: min(360px, calc(100% - 32px));
      transform: translate(-50%, -50%);
      padding: 18px;
      border-radius: 8px;
      background: rgba(8,10,12,0.82);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .status-title{
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text);
      text-align: center;
    }

    .status-track{
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }

    .status-bar{
      width: 18%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--main), var(--accent-warm));
      box-shadow: none;
      transition: width 0.18s ease;
    }

    /* bottom hint */
    .hint{
      position: fixed;
      left: 16px;
      bottom: 14px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(8,10,12,0.78);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      font-size: 12px;
      color: var(--muted);
      max-width: min(520px, calc(100% - 32px));
    }

    .error{
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 20;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 60, 60, 0.12);
      border: 1px solid rgba(255, 90, 90, 0.35);
      color: rgba(255,255,255,.9);
      font-size: 13px;
      display:none;
      backdrop-filter: blur(10px);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      pointer-events: none;
    }

    .modal.is-open {
      display: block;
      pointer-events: auto;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }

    .modal-dialog {
      position: relative;
      width: min(560px, calc(100% - 24px));
      margin: 10vh auto 0;
      padding: 28px 22px;
      border-radius: 8px;
      background: rgba(8,10,12,0.96);
      border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .modal-close:hover {
      background: rgba(139,92,246,0.24);
    }

    .modal-title {
      margin: 6px 0 8px;
      font-size: 26px;
      color: var(--text);
      text-align: center;
    }

    .modal-subtitle {
      margin-bottom: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-form {
      display: grid;
      gap: 12px;
    }

    .field span {
      display: block;
      margin: 2px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      outline: none;
      font: inherit;
    }

    .field input:focus {
      border-color: rgba(139,92,246,0.65);
      box-shadow: 0 0 0 4px rgba(139,92,246,0.16);
    }

    .modal-submit {
      width: 100%;
      margin-top: 8px;
    }

    .modal-note {
      min-height: 18px;
      margin-top: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width:720px){
      .topbar{
        align-items: stretch;
      }

      .brand-group{
        gap: 12px;
      }

      .topbar-partners img{
        height: 30px;
      }

      .topbar-partners .topbar-logo-platform{
        height: 38px;
      }

      .hint{
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
      }

    }

    @media (max-width:480px){
      .topbar{
        flex-wrap: wrap;
        gap: 8px;
        padding:10px 12px;
      }

      .brand-group{
        width: 100%;
        justify-content: space-between;
        gap: 10px;
      }

      .brand{
        font-size: 13px;
      }

      .topbar-partners{
        gap: 7px;
      }

      .topbar-partners img{
        height: 28px;
      }

      .topbar-partners .topbar-logo-platform{
        height: 34px;
      }

      .actions{
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }

      .btn{
        flex: 1;
        min-height: 40px;
        padding:10px 12px;
      }

      #wrap{inset: 116px 0 0}

      .status{
        width: calc(100% - 28px);
        padding: 16px;
      }

      .hint{
        padding: 9px 10px;
        font-size: 11px;
        line-height: 1.35;
      }

      .modal-dialog{
        width: calc(100% - 20px);
        margin-top: 72px;
        padding: 24px 18px;
      }
    }

    @media (max-width:380px){
      .brand{
        font-size: 12px;
        letter-spacing: 1px;
      }

      .topbar-partners img{
        height: 24px;
      }

      .topbar-partners .topbar-logo-platform{
        height: 30px;
      }

      #wrap{inset: 110px 0 0}

    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="topbar">
    <div class="brand-group">
      <div class="brand">СИБКАРТ · 3D</div>
      <div class="topbar-partners" aria-label="Партнёры проекта">
        <img src="assets/images/fond.png" alt="Фонд содействия инновациям">
        <img class="topbar-logo-platform" src="assets/images/platform.png" alt="Платформа университетского технологического предпринимательства">
      </div>
    </div>
    <div class="actions">
      <button class="btn secondary" id="openLeadModal" type="button">Получить презентацию</button>
      <button class="btn" id="backBtn" type="button">Назад</button>
    </div>
  </div>

  <div id="wrap"></div>

  <div class="status" id="statusBox" role="status" aria-live="polite">
    <div class="status-title" id="statusText">Загрузка 3D-модели</div>
    <div class="status-track" aria-hidden="true">
      <div class="status-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="hint">
    Управление: вращай мышью, приближай колесом, на телефоне используй жесты.
  </div>

  <div class="error" id="errBox"></div>

  <div class="modal" id="leadModal" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>

    <div class="modal-dialog" role="dialog" aria-modal="true">
      <button class="modal-close" type="button" data-close="true">×</button>

      <h3 class="modal-title">Получить презентацию</h3>
      <p class="modal-subtitle">
        Оставьте контакты — отправим материалы и ответим на вопросы
      </p>

      <form class="modal-form" id="leadForm">
        <label class="field">
          <span>Имя</span>
          <input type="text" name="name" placeholder="Например: Максим" required>
        </label>

        <label class="field">
          <span>Номер телефона</span>
          <input
            type="tel"
            name="phone"
            id="phoneInput"
            placeholder="+7 ___ ___ __-__"
            required
          >
        </label>

        <label class="field">
          <span>ID Telegram</span>
          <input type="text" name="telegram" placeholder="@username">
        </label>

        <button class="btn modal-submit" type="submit">Отправить</button>
        <div class="modal-note" id="leadFormNote" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const openBtn = document.getElementById("openLeadModal");
      const modal = document.getElementById("leadModal");
      const form = document.getElementById("leadForm");
      const note = document.getElementById("leadFormNote");
      const phoneInput = document.getElementById("phoneInput");
      const tgInput = form ? form.querySelector('input[name="telegram"]') : null;
      const backBtn = document.getElementById("backBtn");

      if (!openBtn || !modal || !form || !note || !phoneInput) return;

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          if (history.length > 1) history.back();
          else window.location.href = "index.html";
        });
      }

      function formatPhone(value) {
        let digits = value.replace(/\D/g, "");

        if (digits.startsWith("8")) digits = "7" + digits.slice(1);
        if (digits.startsWith("9")) digits = "7" + digits;

        digits = digits.slice(0, 11);

        let result = "+7";
        if (digits.length > 1) result += " " + digits.slice(1, 4);
        if (digits.length >= 5) result += " " + digits.slice(4, 7);
        if (digits.length >= 8) result += " " + digits.slice(7, 9);
        if (digits.length >= 10) result += "-" + digits.slice(9, 11);

        return result;
      }

      function openModal() {
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        note.textContent = "";
        note.style.color = "";
        form.querySelector("input").focus();
      }

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        note.textContent = "";
        note.style.color = "";
        form.reset();
      }

      openBtn.addEventListener("click", openModal);

      modal.addEventListener("click", (event) => {
        if (event.target && event.target.dataset.close === "true") closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });

      phoneInput.addEventListener("focus", () => {
        if (!phoneInput.value) phoneInput.value = "+7 ";
      });

      phoneInput.addEventListener("input", () => {
        phoneInput.value = formatPhone(phoneInput.value);
      });

      if (tgInput) {
        tgInput.addEventListener("focus", () => {
          if (!tgInput.value.trim()) tgInput.value = "@";
        });

        tgInput.addEventListener("input", () => {
          let value = tgInput.value.trim().replace(/\s+/g, "");
          if (!value) return;
          value = value.replace(/^@+/, "");
          tgInput.value = "@" + value;
        });

        tgInput.addEventListener("blur", () => {
          if (tgInput.value.trim() === "@") tgInput.value = "";
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = form.elements.name.value.trim();
        const phoneDigits = phoneInput.value.replace(/\D/g, "");

        if (!name || phoneDigits.length < 11) {
          note.textContent = "Пожалуйста, заполните имя и корректный номер телефона.";
          note.style.color = "#ff6b6b";
          return;
        }

        note.textContent = "Заявка отправлена! Мы свяжемся с вами.";
        note.style.color = "#8B5CF6";

        setTimeout(closeModal, 1200);
      });
    });

    window.addEventListener("error", (event) => {
      const errBox = document.getElementById("errBox");
      const statusBox = document.getElementById("statusBox");

      if (!errBox || !statusBox) return;

      const message = event.message || "";
      const filename = event.filename || "";
      const isModuleLoadError =
        message.includes("module") ||
        message.includes("specifier") ||
        filename.includes("unpkg.com");

      if (!isModuleLoadError) return;

      statusBox.style.display = "none";
      errBox.style.display = "block";
      errBox.textContent = "Не удалось загрузить 3D-библиотеку. Проверь интернет-соединение и обнови страницу.";
    });
  </script>

  <script type="module">
    // ✅ Three.js через CDN (работает без сборки)
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    const wrap = document.getElementById("wrap");
    const errBox = document.getElementById("errBox");
    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");
    const progressBar = document.getElementById("progressBar");

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x050607, 12, 60);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
    camera.position.set(0.8, 0.55, 1.25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    wrap.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.6;
    controls.target.set(0, 0, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.addEventListener("start", () => {
      controls.autoRotate = false;
    });

    // Lights (смотрится "дороже" чем один источник)
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(3, 4, 2);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.65);
    fillLight.position.set(-3, 1.5, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x8B5CF6, 0.75);
    rimLight.position.set(-2, 3, -3);
    scene.add(rimLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    // Subtle ground (не обязателен, но выглядит солиднее)
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x050607,
      metalness: 0.0,
      roughness: 1.0,
      transparent: true,
      opacity: 0.55
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.18;
    scene.add(ground);

    const grid = new THREE.GridHelper(40, 40, 0x8B5CF6, 0x2a2020);
    grid.material.transparent = true;
    grid.material.opacity = 0.18;
    grid.position.y = ground.position.y + 0.002;
    scene.add(grid);

    // Model
    let modelMesh = null;
    const loader = new STLLoader();

    const STL_PATHS = ["assets/models/karting.stl", "assets/models/kart.stl"];
    const MODEL_ROTATION_X = -Math.PI / 2;
    const CAMERA_FIT_PADDING = 1.25;

    function setStatus(text, percent) {
      statusText.textContent = text;
      progressBar.style.width = `${Math.max(12, Math.min(percent, 100))}%`;
    }

    function hideStatus() {
      statusBox.style.display = "none";
    }

    function showError(msg) {
      hideStatus();
      errBox.style.display = "block";
      errBox.textContent = msg;
    }

    function fitToObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Нормализуем цель
      controls.target.copy(center);

      // Подбираем дистанцию камеры
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = THREE.MathUtils.degToRad(camera.fov);
      let cameraZ = (maxDim / 2) / Math.tan(fov / 2);
      cameraZ *= CAMERA_FIT_PADDING;

      // Сохраняем "угол" просмотра
      const dir = new THREE.Vector3(1, 0.65, 1.2).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(cameraZ));

      camera.near = Math.max(0.01, cameraZ / 100);
      camera.far = cameraZ * 100;
      camera.updateProjectionMatrix();

      controls.minDistance = cameraZ * 0.35;
      controls.maxDistance = cameraZ * 4;
      controls.update();
    }

    function loadStl(paths) {
      const [currentPath, ...fallbackPaths] = paths;

      if (!currentPath) {
        showError(
          "Не удалось загрузить STL. Проверь, что на GitHub есть файл assets/models/karting.stl."
        );
        return;
      }

      loader.load(
        currentPath,
        (geometry) => {
        geometry.computeVertexNormals();

        // Материал: металлик/пластик в фирменном стиле
        const mat = new THREE.MeshStandardMaterial({
          color: 0xbfc5cc,
          metalness: 0.52,
          roughness: 0.34
        });

        modelMesh = new THREE.Mesh(geometry, mat);
        modelMesh.rotation.x = MODEL_ROTATION_X;

        // Центрируем геометрию
        geometry.computeBoundingBox();
        const box = geometry.boundingBox;
        const center = new THREE.Vector3();
        box.getCenter(center);
        const size = new THREE.Vector3();
        box.getSize(size);
        geometry.translate(-center.x, -center.y, -center.z);
        geometry.computeBoundingBox();

        // Ставим модель на визуальную плоскость.
        const maxDim = Math.max(size.x, size.y, size.z);
        ground.position.y = -maxDim * 0.025;
        grid.position.y = ground.position.y + 0.002;
        modelMesh.updateMatrixWorld(true);

        const rotatedBox = new THREE.Box3().setFromObject(modelMesh);
        modelMesh.position.y += ground.position.y - rotatedBox.min.y;

        scene.add(modelMesh);
        fitToObject(modelMesh);
        hideStatus();
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          setStatus(`Загрузка 3D-модели: ${percent}%`, percent);
        } else {
          setStatus("Загрузка 3D-модели", 45);
        }
      },
      (err) => {
        console.error(err);
        loadStl(fallbackPaths);
      }
      );
    }

    loadStl(STL_PATHS);

    // Resize
    function onResize() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", onResize);

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // iOS: иногда помогает корректно начать рендер после появления
    setTimeout(onResize, 50);
  </script>
</body>
</html>
